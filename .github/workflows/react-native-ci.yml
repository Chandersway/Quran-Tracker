name: React Native CI

on:
  pull_request:
    paths:
      - "react-native/**"
      - "app/src/main/**"
      - "supabase/functions/group-push/**"
      - "supabase/functions/apple-account-delete/**"
      - "supabase/config.toml"
      - "supabase/tests/**"
      - "supabase/migrations/**"
      - ".github/workflows/react-native-ci.yml"
      - ".github/workflows/react-native-release.yml"
  push:
    branches: [main, "work/**"]
    paths:
      - "react-native/**"
      - "app/src/main/**"
      - "supabase/functions/group-push/**"
      - "supabase/functions/apple-account-delete/**"
      - "supabase/config.toml"
      - "supabase/tests/**"
      - "supabase/migrations/**"
      - ".github/workflows/react-native-ci.yml"
      - ".github/workflows/react-native-release.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: react-native-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, lint, test, and export
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react-native
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react-native/package-lock.json
      - name: Set up Java for isolated native runtime probes
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - name: Install dependencies
        run: npm ci
      - name: Check Expo app configuration
        run: node scripts/check-config.mjs --local
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Check source formatting
        run: npm run format:check
      - name: Run tests
        run: npm test
      - name: Check Apple account deletion function and signed-token tests
        working-directory: supabase/functions/apple-account-delete
        run: |
          npx --yes deno@2.9.6 check --node-modules-dir=none --no-lock index.ts
          npx --yes deno@2.9.6 test --node-modules-dir=none --no-lock appleProvider_test.ts
      - name: Export Android, iOS, and web bundles
        run: npm run export -- --output-dir dist-ci

  android-native:
    name: Compile Android and test native PDF cropping
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: react-native
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: react-native/package-lock.json
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Install dependencies
        run: npm ci
      - name: Generate Android project without production credentials
        run: npx expo prebuild --platform android --no-install
      - name: Compile both Android architectures and run native worker tests
        run: |
          chmod +x android/gradlew
          android/gradlew -p android :mushaf-pdf-crop:testDebugUnitTest :app:assembleDebug -PreactNativeArchitectures=arm64-v8a,x86_64 --max-workers=2 --console=plain
