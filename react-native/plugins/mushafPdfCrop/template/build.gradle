apply plugin: 'com.android.library'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'com.Ameender.qurantracker.pdfcrop'
    compileSdk rootProject.ext.compileSdkVersion
    ndkVersion rootProject.ext.ndkVersion
    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        consumerProguardFiles 'consumer-rules.pro'
        ndk {
            abiFilters (*((findProperty('reactNativeArchitectures') ?: 'armeabi-v7a,arm64-v8a,x86,x86_64').split(',')))
        }
        externalNativeBuild {
            cmake { arguments '-DCMAKE_OBJECT_PATH_MAX=240' }
        }
    }
    externalNativeBuild {
        cmake {
            path 'src/main/cpp/CMakeLists.txt'
            if (System.getenv('WIRDNA_NATIVE_BUILD_DIR')) {
                buildStagingDirectory file(System.getenv('WIRDNA_NATIVE_BUILD_DIR') + '/pdf-crop')
            }
        }
    }
}

dependencies {
    implementation 'com.facebook.react:react-android'
    // Already packaged by react-native-pdf 7.0.5; no additional PDF engine.
    implementation 'io.legere:pdfiumandroid:1.0.32'
    testImplementation 'junit:junit:4.13.2'
}
